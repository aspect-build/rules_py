[project]
name = "pycross_setuptools"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "build",
    "setuptools",
    "wheel",
    "cffi",
    "cython<3.0",
    "pyyaml==6.0.1",
    "setproctitle==1.3.7",
    "zstandard==0.22.0",
]

[tool.uv]
no-binary-package = [
    "pyyaml",
    "setproctitle",
    "zstandard",
]
