[project]
name = "ambig"
version = "0.0.0"
requires-python = "== 3.10.19"
dependencies = []

[project.optional-dependencies]
build-tools = ["build", "cowsay==6.0", "flit-core", "setuptools"]

[dependency-groups]
ambig-a = [
    "packaging==24.0",
]

ambig-b = [
    "packaging==21.3",
]

[tool.uv]
no-binary-package = ["cowsay"]
conflicts = [
    [
      { group = "ambig-a" },
      { group = "ambig-b" },
    ],
]

[tool.uv.extra-build-dependencies]
packaging = ["pyparsing"]
cowsay = ["packaging>=24.0"]
